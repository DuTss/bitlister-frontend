<div class="form-container">
  <h2>Publier une annonce</h2>

  @if (errorMessage) {
    <div class="error-banner">{{ errorMessage }}</div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Titre de l'annonce</label>
      <input
        type="text"
        id="title"
        [(ngModel)]="listing.title"
        name="title"
        placeholder="ex: Trezor Model T neuf"
        required
      />
    </div>

    <!-- Section Calculateur de Prix Dynamique -->
    <div class="price-calculator-group">
      <div class="form-group">
        <label for="priceInSats">Prix (en Satoshis) *</label>
        <input
          type="number"
          id="priceInSats"
          [(ngModel)]="listing.priceInSats"
          (input)="onSatsInput()"
          name="priceInSats"
          placeholder="ex: 50000"
          min="1"
          required
        />
      </div>

      <div class="form-group">
        <label for="priceInEur">Équivalent indicatif (en €)</label>
        <input
          type="number"
          id="priceInEur"
          [(ngModel)]="priceInEur"
          (input)="onEurInput()"
          name="priceInEur"
          placeholder="ex: 42.50"
          step="0.01"
          min="0"
        />
      </div>
    </div>

    <!-- Affichage du montant conversion BTC -->
    @if (listing.priceInSats && listing.priceInSats > 0) {
      <div class="btc-preview">
        <span>Valeur exacte en Bitcoin : <strong>{{ listing.priceInSats | satsToBtc }}</strong></span>
      </div>
    }

    <div class="form-group">
      <label for="category">Catégorie</label>
      <select id="category" [(ngModel)]="listing.category" name="category">
        <option value="Hardware">Hardware</option>
        <option value="Livres">Livres</option>
        <option value="Informatique">Informatique</option>
        <option value="Services">Services</option>
        <option value="Divers">Divers</option>
      </select>
    </div>

    <div class="form-group">
      <label for="location">Localisation (Ville ou Région)</label>
      <input
        type="text"
        id="location"
        [(ngModel)]="listing.location"
        name="location"
        placeholder="ex: Paris, Lyon, Envoi possible..."
        required
      />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        [(ngModel)]="listing.description"
        name="description"
        rows="5"
        placeholder="Détaillez l'état du matériel, le mode de livraison ou de remise en main propre..."
        required
      ></textarea>
    </div>

    <button type="submit" class="btn-submit">Déposer l'annonce</button>
  </form>
</div>
