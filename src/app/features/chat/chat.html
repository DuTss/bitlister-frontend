<div class="chat-container">
  <header class="chat-header">
    <h3>🔒 Discussion Chiffrée P2P (E2EE)</h3>
    <span class="room-badge">Canal : {{ chatRoomId }}</span>
  </header>

  <div class="chat-messages">
    @for (msg of messages; track msg.timestamp) {
      <div class="message-bubble" [class.me]="msg.isMe">
        <span class="sender">{{ msg.isMe ? 'Vous' : msg.senderId }}</span>
        <p class="text">{{ msg.text }}</p>
        <span class="time">{{ msg.timestamp | date:'HH:mm' }}</span>
      </div>
    } @empty {
      <p class="empty-chat">Aucun message. Les échanges sont chiffrés de bout en bout.</p>
    }
  </div>

  <form class="chat-input-area" (ngSubmit)="send()">
    <input
      type="text"
      [(ngModel)]="newMessageText"
      name="message"
      placeholder="Écrivez un message chiffré..."
      autocomplete="off"
    />
    <button type="submit" [disabled]="!newMessageText.trim()">Envoyer ⚡</button>
  </form>
</div>
