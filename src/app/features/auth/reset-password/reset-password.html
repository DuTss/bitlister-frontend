<div class="auth-container">
  <h2>Définir un nouveau mot de passe</h2>

  @if (successMessage) {
    <div class="alert alert-success">
      <p>{{ successMessage }}</p>
      <a routerLink="/login" class="btn-submit btn-link-login">Se connecter</a>
    </div>
  } @else {
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      @if (errorMessage) {
        <div class="alert alert-error">{{ errorMessage }}</div>
      }

      <div class="form-group">
        <label for="newPassword">Nouveau mot de passe</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="6 caractères minimum"
          class="form-control"
          [class.is-invalid]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
        />
        @if (resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched) {
          <span class="error-text">Le mot de passe doit contenir au moins 6 caractères.</span>
        }
      </div>

      <button type="submit" [disabled]="resetForm.invalid || submitting || !token" class="btn-submit">
        {{ submitting ? 'Validation...' : 'Changer mon mot de passe' }}
      </button>
    </form>
  }
</div>
