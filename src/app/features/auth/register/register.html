<div class="auth-container">
  <h2>Créer un compte</h2>

  @if (errorMessage) {
    <div class="error-banner">{{ errorMessage }}</div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Adresse Email</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="credentials.email"
        name="email"
        placeholder="pseudo@getalby.com"
        required
      />
    </div>

    <div class="form-group">
      <label for="pseudo">Pseudo (nom public)</label>
      <input
        type="text"
        id="pseudo"
        [(ngModel)]="credentials.pseudo"
        name="pseudo"
        placeholder="Satoshi Nakamoto"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="credentials.password"
        name="password"
        placeholder=""
        required
      />
    </div>

    <div class="form-group">
      <label for="lightningAddress">Adresse Lightning (optionnel)</label>
      <input
        type="text"
        id="lightningAddress"
        [(ngModel)]="credentials.lightningAddress"
        name="lightningAddress"
        placeholder="QR code ou adresse Lightning"
      />
    </div>

    <button type="submit" class="btn-submit">Créer mon compte</button>
  </form>

  <p class="auth-link">
    Déjà un compte ? <a routerLink="/login">Se connecter</a>
  </p>
</div>
