<header class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">Bit<strong>Lister</strong></span>
    </a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Annonces</a>

      @if (authService.currentUser(); as user) {
        <div class="user-menu">
          <!-- Nouveau lien de messagerie -->
          <a routerLink="/messages" routerLinkActive="active">💬 Messages</a>
          <a routerLink="/favorites" routerLinkActive="active">Favoris</a>
          <a routerLink="/profile" routerLinkActive="active">Mon profil</a>
          <span class="user-badge">👤 {{ user.pseudo }}</span>
          <button (click)="authService.logout()" class="btn-logout" routerLink="/">Déconnexion</button>
        </div>
      } @else {
        <a routerLink="/login" class="btn-link">Connexion</a>
        <a routerLink="/register" class="btn-primary">S'inscrire</a>
      }
    </nav>
  </div>
</header>
