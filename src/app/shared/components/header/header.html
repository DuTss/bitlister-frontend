<header class="navbar">
  <div class="logo">
    <a routerLink="/">⚡ <strong>BitLister</strong></a>
  </div>
  <nav>
    <a routerLink="/">Annonces</a>
    @if (authService.currentUser(); as user) {
      <a routerLink="/create-listing" class="btn-primary">+ Déposer une annonce</a>
      <span class="user-welcome">Bonjour, <strong>{{ user.username }}</strong></span>
      <button (click)="authService.logout()" class="btn-logout">Déconnexion</button>
    } @else {
      <a routerLink="/login">Connexion</a>
      <a routerLink="/register" class="btn-primary">S'inscrire</a>
    }
  </nav>
</header>
